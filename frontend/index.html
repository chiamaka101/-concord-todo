<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concord Todo Demo</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 30px 16px 60px; min-height: 100vh; color: #1e293b; background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); background-attachment: fixed; }
        .app { max-width: 640px; margin: 0 auto; background: rgba(255,255,255,0.96); border-radius: 24px; padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
        h1 { text-align: center; color: #1e293b; margin: 0 0 6px; font-size: 28px; letter-spacing: -0.5px; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin: 0 0 22px; }
        .todo-form { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .todo-form input[type="text"] { flex: 1; min-width: 180px; padding: 12px 14px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; }
        .todo-form input[type="text"]:focus { border-color: #667eea; }
        .todo-form input[type="date"], .todo-form select { padding: 11px; font-size: 14px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; color: #475569; background: white; }
        .todo-form button { padding: 12px 22px; font-size: 15px; font-weight: 600; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(102,126,234,0.4); }
        .controls { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        .controls input[type="text"] { flex: 1; min-width: 160px; padding: 10px 14px; font-size: 14px; border: 2px solid #e2e8f0; border-radius: 999px; outline: none; }
        .controls select { padding: 9px 12px; font-size: 13px; font-weight: 600; border: 2px solid #e2e8f0; border-radius: 999px; background: white; color: #475569; outline: none; }
        .filter-btn { padding: 8px 16px; font-size: 13px; font-weight: 600; border: 2px solid #e2e8f0; background: white; color: #64748b; border-radius: 999px; cursor: pointer; }
        .filter-btn.active { background: #1e293b; color: white; border-color: #1e293b; }
        .count { text-align: center; font-size: 13px; color: #94a3b8; margin: 6px 0 14px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #f8fafc; padding: 14px; margin-bottom: 10px; border-radius: 16px; border: 1px solid #f1f5f9; }
        li:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); background: white; }
        .todo-content { display: flex; align-items: center; gap: 10px; flex: 1; flex-wrap: wrap; min-width: 0; }
        .todo-content input[type="checkbox"] { width: 20px; height: 20px; accent-color: #667eea; cursor: pointer; flex-shrink: 0; }
        .todo-text { font-size: 15px; font-weight: 500; word-break: break-word; }
        .completed { text-decoration: line-through; color: #94a3b8; }
        .due-date { font-size: 12px; font-weight: 600; color: #64748b; background: #e2e8f0; padding: 4px 9px; border-radius: 999px; }
        .overdue { color: #dc2626 !important; background: #fee2e2 !important; }
        .cat-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.3px; }
        .cat-Personal { background: #ede9fe; color: #7c3aed; }
        .cat-Work { background: #dbeafe; color: #2563eb; }
        .cat-Shopping { background: #fef3c7; color: #d97706; }
        .cat-Urgent { background: #fee2e2; color: #dc2626; }
        .cat-Other { background: #e2e8f0; color: #475569; }
        .actions { display: flex; gap: 6px; flex-shrink: 0; }
        .edit-btn { background: #f59e0b; color: white; border: none; padding: 7px 13px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 7px 13px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .empty { text-align: center; color: #94a3b8; padding: 30px 10px; font-size: 15px; }
        .empty span { font-size: 32px; display: block; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="app">
    <h1> Concord Todo</h1>
    <p class="subtitle">Stay organized, stay in control</p>
    <div class="todo-form">
        <input type="text" id="todoInput" placeholder="What needs to be done?">
        <input type="date" id="dueDateInput">
        <select id="categoryInput">
            <option value="Personal">🟣 Personal</option>
            <option value="Work">🔵 Work</option>
            <option value="Shopping">🟡 Shopping</option>
            <option value="Urgent">🔴 Urgent</option>
            <option value="Other">⚪ Other</option>
        </select>
        <button id="addBtn">+ Add</button>
    </div>
    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍 Search todos...">
        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Personal">🟣 Personal</option>
            <option value="Work">🔵 Work</option>
            <option value="Shopping">🟡 Shopping</option>
            <option value="Urgent">🔴 Urgent</option>
            <option value="Other">⚪ Other</option>
        </select>
    </div>
    <div class="controls">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Done</button>
    </div>
    <p class="count" id="countLabel"></p>
    <ul id="todoList"></ul>
    </div>
    <script>
        const API_URL = 'http://localhost:3001/api/todos';
        const todoInput = document.getElementById('todoInput');
        const dueDateInput = document.getElementById('dueDateInput');
        const categoryInput = document.getElementById('categoryInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const searchInput = document.getElementById('searchInput');
        const countLabel = document.getElementById('countLabel');
        let allTodos = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let currentCategory = 'all';
        function getTodayDateString() { const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`; }
        async function fetchTodos() { try { const res = await fetch(API_URL); allTodos = await res.json(); renderTodos(); } catch (err) { console.error(err); } }
        async function addTodo() {
            const text = todoInput.value.trim();
            const dueDate = dueDateInput.value ? dueDateInput.value : null;
            const category = categoryInput.value;
            if (!text) return;
            try { await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, dueDate, category }) }); todoInput.value = ''; dueDateInput.value = ''; fetchTodos(); } catch (err) { console.error(err); }
        }
        async function toggleTodo(id) { try { await fetch(`${API_URL}/${id}`, { method: 'PUT' }); fetchTodos(); } catch (err) { console.error(err); } }
        async function editTodo(todo) {
            const newText = prompt("Edit todo:", todo.text);
            if (newText === null || !newText.trim()) return;
            const newDueDate = prompt("Edit due date (YYYY-MM-DD, leave blank for none):", todo.dueDate || "");
            const newCat = prompt("Edit category (Personal / Work / Shopping / Urgent / Other):", todo.category || "Personal");
            try { await fetch(`${API_URL}/${todo.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: newText.trim(), dueDate: newDueDate ? newDueDate : null, category: newCat || 'Personal' }) }); fetchTodos(); } catch (err) { console.error(err); }
        }
        async function deleteTodo(id) { try { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); fetchTodos(); } catch (err) { console.error(err); } }
        function renderTodos() {
            todoList.innerHTML = '';
            const todayStr = getTodayDateString();
            const activeCount = allTodos.filter(t => !t.done).length;
            countLabel.textContent = allTodos.length === 0 ? '' : `${activeCount} left to do • ${allTodos.length} total`;
            let filtered = allTodos.filter(todo => {
                if (currentFilter === 'active' && todo.done) return false;
                if (currentFilter === 'completed' && !todo.done) return false;
                if (currentCategory !== 'all' && todo.category !== currentCategory) return false;
                if (searchQuery && !todo.text.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                return true;
            });
            if (filtered.length === 0) { const p = document.createElement('p'); p.className = 'empty'; p.innerHTML = `<span>🎉</span>${searchQuery || currentCategory !== 'all' ? 'No todos match your filters.' : 'All clear! Add a new todo above.'}`; todoList.appendChild(p); return; }
            filtered.forEach(todo => {
                const li = document.createElement('li');
                const isOverdue = todo.dueDate && todo.dueDate < todayStr && !todo.done;
                const contentDiv = document.createElement('div'); contentDiv.className = 'todo-content';
                const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = todo.done; checkbox.onchange = () => toggleTodo(todo.id);
                const textSpan = document.createElement('span'); textSpan.className = `todo-text ${todo.done ? 'completed' : ''}`; textSpan.textContent = todo.text;
                contentDiv.appendChild(checkbox); contentDiv.appendChild(textSpan);
                const catSpan = document.createElement('span'); catSpan.className = `cat-badge cat-${todo.category || 'Personal'}`; catSpan.textContent = todo.category || 'Personal'; contentDiv.appendChild(catSpan);
                if (todo.dueDate) { const dueSpan = document.createElement('span'); dueSpan.className = `due-date ${isOverdue ? 'overdue' : ''}`; dueSpan.textContent = isOverdue ? `⚠️ Overdue • ${todo.dueDate}` : `📅 ${todo.dueDate}`; contentDiv.appendChild(dueSpan); }
                const actions = document.createElement('div'); actions.className = 'actions';
                const editBtn = document.createElement('button'); editBtn.className = 'edit-btn'; editBtn.textContent = 'Edit'; editBtn.onclick = () => editTodo(todo);
                const deleteBtn = document.createElement('button'); deleteBtn.className = 'delete-btn'; deleteBtn.textContent = 'Delete'; deleteBtn.onclick = () => deleteTodo(todo.id);
                actions.appendChild(editBtn); actions.appendChild(deleteBtn);
                li.appendChild(contentDiv); li.appendChild(actions); todoList.appendChild(li);
            });
        }
        addBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTodo(); });
        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; renderTodos(); });
        categoryFilter.addEventListener('change', (e) => { currentCategory = e.target.value; renderTodos(); });
        document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentFilter = btn.dataset.filter; renderTodos(); }); });
        fetchTodos();
    </script>
</body>
</html>
